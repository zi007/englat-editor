# Builds the browser version and uploads it to a Cloudflare R2 bucket.
# Needs repository secrets: R2_ACCOUNT_ID, R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY, R2_BUCKET
# (S3-compatible R2 credentials). Use a SEPARATE bucket and a token scoped to it only; never reuse
# the production learner-audio credentials. It fails until the secrets exist. See docs/deploy-web.md.
name: deploy-web
on:
  workflow_dispatch:
  # Temporary: lets the deploy run from this branch before it is merged to main. Remove after merge.
  push:
    branches: [work/deploy-cloudflare]
permissions:
  contents: read
jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup target add wasm32-unknown-unknown
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: web-${{ hashFiles('Cargo.lock') }}
      - name: Install trunk
        run: cargo install trunk --locked --version 0.21.14
      - name: Build (release, wasm-opt -Oz)
        working-directory: apps/englat-editor-web
        run: trunk build --release
      - name: Report sizes
        run: |
          ls -la dist/web
          for f in dist/web/*.wasm; do echo "gzip: $(gzip -9 -c "$f" | wc -c) bytes"; done
      - name: Upload to R2 (S3 API)
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          set -euo pipefail
          test -n "$R2_BUCKET" && test -n "$R2_ACCOUNT_ID" || { echo "R2 secrets are not set"; exit 1; }
          endpoint="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          cd dist/web
          for f in *; do
            case "$f" in
              *.wasm) ct="application/wasm"; cc="public, max-age=31536000, immutable" ;;
              *.js)   ct="text/javascript";  cc="public, max-age=31536000, immutable" ;;
              *.ico)  ct="image/x-icon";     cc="public, max-age=86400" ;;
              index.html) ct="text/html; charset=utf-8"; cc="no-cache" ;;
              *)      ct="application/octet-stream"; cc="public, max-age=3600" ;;
            esac
            aws s3 cp "$f" "s3://$R2_BUCKET/$f" --endpoint-url "$endpoint" --content-type "$ct" --cache-control "$cc"
          done
