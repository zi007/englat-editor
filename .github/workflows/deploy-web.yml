# Builds the browser version and uploads it to a Cloudflare R2 bucket.
# Needs repository secrets: CLOUDFLARE_API_TOKEN (R2 edit), CLOUDFLARE_ACCOUNT_ID, R2_BUCKET.
# It does nothing until those secrets exist. See docs/deploy-web.md.
name: deploy-web
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup target add wasm32-unknown-unknown
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: web-${{ hashFiles('Cargo.lock') }}
      - name: Install trunk
        run: cargo install trunk --locked --version 0.21.14
      - name: Build (release, wasm-opt -Oz)
        working-directory: apps/englat-editor-web
        run: trunk build --release
      - name: Report sizes
        run: |
          ls -la dist/web
          for f in dist/web/*.wasm; do echo "gzip: $(gzip -9 -c "$f" | wc -c) bytes"; done
      - name: Upload to R2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          set -euo pipefail
          test -n "$R2_BUCKET" || { echo "R2_BUCKET secret is not set"; exit 1; }
          cd dist/web
          for f in *; do
            case "$f" in
              *.wasm) ct="application/wasm"; cc="public, max-age=31536000, immutable" ;;
              *.js)   ct="text/javascript";  cc="public, max-age=31536000, immutable" ;;
              *.ico)  ct="image/x-icon";     cc="public, max-age=86400" ;;
              index.html) ct="text/html; charset=utf-8"; cc="no-cache" ;;
              *)      ct="application/octet-stream"; cc="public, max-age=3600" ;;
            esac
            npx --yes wrangler@4 r2 object put "$R2_BUCKET/$f" --file "$f" --content-type "$ct" --cache-control "$cc" --remote
          done
