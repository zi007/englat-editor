[package]
name = "englat-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "ENGLAT Editor engine: session, selection, undo, the command registry (every action is a command), Word's command catalog, file I/O dispatch"

[lints]
workspace = true

[dependencies]
englat-geom = { workspace = true }
englat-doc = { workspace = true }
englat-fonts = { workspace = true }
englat-layout = { workspace = true }
englat-render = { workspace = true }
englat-proof = { workspace = true }
englat-docx = { workspace = true }
englat-docbin = { workspace = true }
englat-pdf = { workspace = true }
englat-formats = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
log = { workspace = true }
regex = { workspace = true }
regex-automata = { workspace = true }
image = { workspace = true }
zeroize = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
# The browser clock for `now_iso` (`SystemTime::now()` panics on wasm32).
js-sys = "0.3"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
getrandom = { workspace = true }

[dev-dependencies]
encoding_rs = { workspace = true }
zip = { workspace = true }
cfb = { workspace = true }
