[package]
name = "englat-pdf"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "ENGLAT Editor PDF export (craft-pdf / Krilla): embedded font subsets with selectable text, links, outline, tagging"

[lints]
workspace = true

[dependencies]
englat-doc = { workspace = true }
englat-geom = { workspace = true }
englat-fonts = { workspace = true }
englat-layout = { workspace = true }
englat-metafile = { workspace = true }
craft-pdf = { workspace = true }
kurbo = { workspace = true }
image = { workspace = true }
thiserror = { workspace = true }
log = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
# The browser clock (`SystemTime::now()` panics on wasm32).
js-sys = "0.3"

[dev-dependencies]
hayro-syntax = "0.7.2"
hayro-interpret = { version = "0.7.0", default-features = false, features = ["embed-fonts"] }
hayro-cmap = "0.1"
