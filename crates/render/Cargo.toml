[package]
name = "englat-render"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "ENGLAT Editor rasteriser: pages and thumbnails from the layout display list (vello_cpu), PNG/JPEG export"

[lints]
workspace = true

[dependencies]
englat-geom = { workspace = true }
englat-doc = { workspace = true }
englat-fonts = { workspace = true }
englat-layout = { workspace = true }
englat-metafile = { workspace = true }
vello_cpu = { workspace = true }
image = { workspace = true }
log = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
vello_cpu = { workspace = true, features = ["multithreading"] }
